name: Keep Render Backend Awake

on:
  schedule:
    # Run once every 3 days at midnight UTC to prevent inactivity without wasting Supabase egress
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Zero-Egress Health Check
        run: curl -sSf https://medichain-kqgy.onrender.com/api/health
